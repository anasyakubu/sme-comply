server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: send unknown paths to index.html so React Router can handle them.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
